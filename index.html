<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d10">
  <meta name="description" content="Links e perfil de Renan, desenvolvedor back-end.">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Renan L. Vendramini — Links</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0d10;
      --surface: #14161b;
      --line: rgba(255, 255, 255, .09);
      --text: #f3f2ef;
      --muted: #9699a3;
      --accent: #6ba4f3;
      --glow-x: 0px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--text);
      background:
        radial-gradient(ellipse at calc(50% + var(--glow-x)) 5%, rgba(107, 184, 243, 0.09), transparent 38rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 440px);
      text-align: center;
      animation: appear .7s ease both;
    }

    .avatar {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border: 1px solid rgba(107, 170, 243, 0.28);
      border-radius: 24px;
      background: linear-gradient(145deg, #252a20, #17191a 70%);
      color: var(--accent);
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -.08em;
      box-shadow: 0 12px 48px rgba(0, 0, 0, .28);
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 7vw, 36px);
      font-weight: 620;
      letter-spacing: -.055em;
    }

    .role {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .stack {
      margin: 14px 0 32px;
      color: #777b85;
      font-size: 12px;
      letter-spacing: .025em;
    }

    nav { display: grid; gap: 11px; }

    .link {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 19px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(115deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 530;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .link:hover, .link:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(107, 177, 243, 0.38);
      background: rgba(107, 168, 243, 0.07);
      outline: none;
    }

    .link span:last-child { color: var(--accent); font-size: 17px; }

    footer {
      margin-top: 33px;
      color: #666973;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">RLV</div>
    <h1>Renan L. Vendramini</h1>
    <p class="role">Desenvolvedor back-end<br>Há mais de 10 anos criando para a web</p>
    <p class="stack">Node.js · PHP · Ruby on Rails · MySQL · Redis</p>

    <nav aria-label="Meus links">
      <a class="link" href="https://github.com/rlvendramini" target="_blank" rel="noopener noreferrer">
        <span>GitHub</span><span aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.linkedin.com/in/rlvendramini/" target="_blank" rel="noopener noreferrer">
        <span>LinkedIn</span><span aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer>São Paulo, Brasil</footer>
  </main>
  <script>
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    if (!reduceMotion.matches) {
      const root = document.documentElement;
      let targetX = 0;
      let currentX = 0;
      let frame = null;

      function moveGlow() {
        currentX += (targetX - currentX) * 0.08;
        if (Math.abs(targetX - currentX) < 0.1) currentX = targetX;
        root.style.setProperty('--glow-x', `${currentX.toFixed(2)}px`);

        if (currentX !== targetX) {
          frame = requestAnimationFrame(moveGlow);
        } else {
          frame = null;
        }
      }

      window.addEventListener('pointermove', (event) => {
        if (event.pointerType !== 'mouse') return;
        const horizontalPosition = (event.clientX / window.innerWidth) * 2 - 1;
        targetX = Math.max(-56, Math.min(56, horizontalPosition * 56));
        if (frame === null) frame = requestAnimationFrame(moveGlow);
      }, { passive: true });
    }
  </script>
</body>
</html>
